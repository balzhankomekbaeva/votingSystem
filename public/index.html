<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decentralized Voting System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <header class="bg-dark text-white p-3">
            <nav class="container d-flex justify-content-between">
                <a href="index.html" class="text-white text-decoration-none fw-bold">Voting System</a>
                <a href="admin.html" class="text-white text-decoration-none fw-bold">Admin Panel</a>
            </nav>
        </header>

        <h2 class="text-center">Decentralized Voting System</h2>

        <!-- Candidate Selection -->
        <div class="row justify-content-center mt-4">
            <div class="col-md-8">
                <h4 class="text-center">Candidates</h4>
                <ul id="candidateList" class="list-group"></ul>
            </div>
        </div>

        <!-- Voting Section -->
        <div class="row justify-content-center mt-4">
            <div class="col-md-6">
                <select id="selectedCandidate" class="form-select mb-2">
                    <option value="">Select a Candidate</option>
                </select>
                <button class="btn btn-primary w-100" onclick="voteForCandidate()">Vote</button>
                <p id="voteStatus" class="mt-2 text-center"></p>
            </div>
        </div>

        <!-- Winner Display -->
        <div class="row justify-content-center mt-4">
            <div class="col-md-6 text-center">
                <button class="btn btn-success w-100" onclick="getWinner()">Show Winner</button>
                <p id="winnerDisplay" class="mt-2"></p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
