<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Decentralized Voting System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <header class="bg-dark text-white p-3">
            <nav class="container d-flex justify-content-between">
                <a href="index.html" class="text-white text-decoration-none fw-bold">Voting System</a>
                <a href="admin.html" class="text-white text-decoration-none fw-bold">Admin Panel</a>
            </nav>
        </header>

        <h2 class="text-center">Admin Panel - Decentralized Voting System</h2>

        <div class="row justify-content-center">
            <div class="col-md-6 col-sm-8 col-12">
                <div class="mb-3">
                    <label for="candidateName" class="form-label">Candidate Name:</label>
                    <input type="text" id="candidateName" class="form-control">
                </div>
                <button class="btn btn-success w-100" onclick="addCandidate()">Add Candidate</button>
                <p id="adminStatus" class="mt-2 text-center"></p>
            </div>
        </div>

        <div class="row justify-content-center mt-4">
            <div class="col-md-6 col-sm-8 col-12">
                <button class="btn btn-danger w-100" onclick="stopVoting()">Stop Voting</button>
                <p id="votingStatus" class="mt-2 text-center"></p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
